%YAML 1.2
---
$id: http://devicetree.org/schemas/net/hisilicon-femac-mdio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Hisilicon Fast Ethernet MDIO Controller interface

maintainers:
  - Yang Xiwen <forbidden405@outlook.com>

allOf:
  - $ref: "mdio.yaml#"

properties:
  compatible:
    const: hisilicon,hisi-femac-mdio

  reg:
    description: address and length of the register set for the device.
    maxItems: 1

  clocks:
    description: A phandle to the reference clock for this device.
    maxItems: 1

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    mdio: mdio@10091100 {
        compatible = "hisilicon,hisi-femac-mdio";
        reg = <0x10091100 0x10>;
        clocks = <&crg 38>;
        #address-cells = <1>;
        #size-cells = <0>;

        phy0: phy@1 {
                reg = <1>;
        };
    };
