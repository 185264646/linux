%YAML 1.2
---
$id: http://devicetree.org/schemas/net/hisilicon-femac.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Hisilicon Fast Ethernet MAC controller

maintainers:
  - Yang Xiwen <forbidden405@outlook.com>

allOf:
  - $ref: "ethernet-controller.yaml#"

properties:
  compatible:
    description: should contain one of the following version strings and the soc string.
    items:
      - enum:
          - "hisilicon,hi3516cv300-femac"
      - enum:
          - "hisilicon,hisi-femac-v1"
          - "hisilicon,hisi-femac-v2"

  reg:
    items:
      - description: the MAC core register base and size
      - description: the global MAC control register

  interrupts:
    maxItems: 1
    description: should contain the MAC interrupt

  clocks:
    minItems: 1
    description: A list of phandles to the MAC clocks

  resets:
    minItems: 1
    items:
      - description: the phandle to the MAC reset signal(required)
      - description: the phandle to the PHY reset signal(optional)

  reset-names:
    minItems: 1
    items:
      - const: mac
      - const: phy

  hisilicon,phy-reset-delays-us:
    description: triplet of delays if PHY reset signal given.
    items:
      - description: The 1st cell is reset pre-delay in micro seconds.
      - description: The 2nd cell is reset pulse in micro seconds.
      - description: The 3rd cell is reset post-delay in micro seconds.

unevaluatedProperties: false

examples:
  - |
        hisi_femac: ethernet@10090000 {
                compatible = "hisilicon,hi3516cv300-femac","hisilicon,hisi-femac-v2";
                reg = <0x10090000 0x1000>,<0x10091300 0x200>;
                interrupts = <12>;
                clocks = <&crg 38>;
                resets = <&crg 0xec 0>,<&crg 0xec 3>;
                reset-names = "mac","phy";
                mac-address = [00 00 00 00 00 00];
                phy-mode = "mii";
                phy-handle = <&phy0>;
                hisilicon,phy-reset-delays-us = <10000 20000 20000>;
        };
