%YAML 1.2
---
$id: http://devicetree.org/schemas/bus/hisilicon,hi3798cv200-usb2phy-test-bus.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon HiSTB SoCs INNO USB2 PHY test bus

description:
  Some HiSilicon HiSTB SoCs have a special register in PERICTRL module. It
  implements a proprietary bus called "PHY test bus", which is used to configure
  the PHY (currently only INNO USB2 PHY).  This bus also provide a clock for itself.

maintainers:
  - Yang Xiwen <forbidden405@outlook.com>

properties:
  compatible:
    enum:
      - hisilicon,hi3798mv100-usb2phy-test-bus
      - hisilicon,hi3798cv200-usb2phy-test-bus

  reg:
    maxItems: 1

  clocks:
    maxItems: 1
    description: bus clock

  '#clock-cells':
    const: 0

  usb2phy:
    $ref: ../phy/hisilicon,inno-usb2-phy.yaml#

required:
  - compatible
  - reg
  - clocks
  - usb2phy

additionalProperties: false

examples:
  - |
    perictrl@8a20000 {
        compatible = "hisilicon,hi3798cv200-perictrl", "syscon", "simple-mfd";
        reg = <0x8a20000 0x1000>;
        #address-cells = <1>;
        #size-cells = <1>;
        ranges = <0x0 0x8a20000 0x1000>;

        usb2phy_test_bus: usb2phy-test-bus@124 {
            compatible = "hisilicon,hi3798cv200-usb2phy-test-bus";
            reg = <0x124 0x4>;
            clocks = <&usb2phy_test_bus>;
            #clock-cells = <0>;

            usb2phy {
                compatible = "hisilicon,hi3798cv200-usb2-phy", "hisilicon,inno-usb2-phy";
                clocks = <&clk_ref>;
                resets = <&crg 0xbc 6>;
                #address-cells = <1>;
                #size-cells = <0>;

                phy@0 {
                    reg = <0>;
                    #phy-cells = <0>;
                    resets = <&crg 0xbc 10>;
                };
            };
        };
    };
...
